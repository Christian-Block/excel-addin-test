name: Integration test (Excel for the web)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build add-in
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_M365_USERNAME: ${{ secrets.E2E_M365_USERNAME }}
          E2E_M365_PASSWORD: ${{ secrets.E2E_M365_PASSWORD }}
          E2E_M365_TOTP_SECRET: ${{ secrets.E2E_M365_TOTP_SECRET }}
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
